name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Unit & Component Tests
        run: npm run test

      - name: Install Playwright Browsers (Chromium & WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Build static web assets
        run: npm run build

      - name: Run Playwright E2E & WebKit Integration Tests
        run: npx playwright test

      - name: Upload Playwright test results (screenshots, traces, reports)
        # Upload regardless of test pass/fail so screenshots are available
        # for both successful and failed test runs in CI.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifacts to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
